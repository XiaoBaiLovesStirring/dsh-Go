name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [mod/ssh-apk]

jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Build the arm64 runtime
        run: runtime/build-runtime.sh arm64-v8a
      - name: Check the bundle
        run: python3 -I tooling/check_runtime_bundle.py arm64
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-arm64-v8a
          path: runtime/out/arm64-v8a
          compression-level: 0
          if-no-files-found: error

  apk:
    needs: runtime
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - uses: actions/download-artifact@v4
        with:
          name: runtime-arm64-v8a
          path: runtime/out/arm64-v8a

      - name: Use the upstream Gradle distribution
        run: |
          sed -i 's|https\\://mirrors.cloud.tencent.com/gradle/|https\\://services.gradle.org/distributions/|' \
            app/android/gradle/wrapper/gradle-wrapper.properties
          grep distributionUrl app/android/gradle/wrapper/gradle-wrapper.properties

      - name: Android platform 36
        run: yes | sdkmanager --licenses >/dev/null 2>&1 || true; sdkmanager "platforms;android-36" "build-tools;36.0.0" >/dev/null || true

      - name: Dependencies
        working-directory: app
        run: flutter pub get

      - name: Build arm64 APK
        working-directory: app
        run: flutter build apk --release --flavor arm64 --target-platform android-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-go-arm64-release
          path: app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
